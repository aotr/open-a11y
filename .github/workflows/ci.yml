name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: pnpm --dir angular-lib install --frozen-lockfile
      - run: pnpm --dir examples/angular install --frozen-lockfile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/link-self.mjs
      - run: npm run test:dist
      - run: npm exec -- vp build examples/vanilla
      - run: npm exec -- vp build examples/react
      - run: npm exec -- vp build examples/vue
      - run: npm exec -- vp build examples/svelte
      - run: pnpm --dir examples/angular build
